<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Dashboard</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --primary: #2d5be3;
    --primary-dark: #1e40af;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e5ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toolbar label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .toolbar-actions { display: flex; gap: 10px; }
  button {
    padding: 9px 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled { background: #cfd6e4; cursor: not-allowed; }
  button.secondary { background: #eef1f6; color: var(--text); }
  button.secondary:hover { background: #e2e6ee; }

  .list { background: var(--card); border-radius: 10px; overflow: hidden; }
  .row {
    display: grid;
    grid-template-columns: 32px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #fafbfc; }
  .name { font-weight: 600; font-size: 15px; cursor: pointer; }
  .name:hover { color: var(--primary); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row-actions { display: flex; gap: 8px; }
  .row-actions button { padding: 6px 12px; font-size: 13px; }
  #empty, #loading { text-align: center; padding: 40px; color: var(--muted); }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: center; justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
  }
  .modal h2 { margin: 0 0 16px; font-size: 18px; }
  .modal .field { margin-bottom: 12px; font-size: 14px; }
  .modal .field b { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .modal-close { margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Data Dashboard</h1>
  <p class="sub">View, select, and export collected entries.</p>

  <div class="toolbar">
    <label><input type="checkbox" id="selectAll"> Select all</label>
    <div class="toolbar-actions">
      <button class="secondary" id="refreshBtn">Refresh</button>
      <button id="exportSelectedBtn" disabled>Export Selected (0)</button>
    </div>
  </div>

  <div class="list" id="list">
    <div id="loading">Loading entries...</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Person Details</h2>
    <div id="modalBody"></div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button id="modalDownloadBtn">Download PDF</button>
      <button class="secondary modal-close" id="modalCloseBtn">Close</button>
    </div>
  </div>
</div>

<script>
  // ⚠️ REPLACE THIS with your deployed Apps Script Web App URL (ends in /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGp7hvFGvf6jekSIH24Sk_9PcZkR-H3KA_12P3JO1UgYOkzfQnntJ5Goc1XLyuzQ/exec";

  let entries = [];
  const listEl = document.getElementById('list');
  const selectAllEl = document.getElementById('selectAll');
  const exportBtn = document.getElementById('exportSelectedBtn');

  function loadEntries() {
    listEl.innerHTML = '<div id="loading">Loading entries...</div>';
    fetch(SCRIPT_URL + '?action=list')
      .then(res => res.json())
      .then(data => {
        if (data.status !== 'success') throw new Error(data.message);
        entries = data.data.reverse(); // most recent first
        render();
      })
      .catch(err => {
        listEl.innerHTML = '<div id="empty">Failed to load: ' + err.message + '</div>';
      });
  }

  function render() {
    if (entries.length === 0) {
      listEl.innerHTML = '<div id="empty">No entries yet.</div>';
      return;
    }
    listEl.innerHTML = entries.map(function (e) {
      const fullName = [e.firstName, e.middleName, e.lastName].filter(Boolean).join(' ');
      return `
        <div class="row">
          <input type="checkbox" class="rowCheck" data-id="${e.id}">
          <div>
            <div class="name" data-id="${e.id}">${fullName || '(no name)'}</div>
            <div class="meta">${e.placeOfBirth || ''}</div>
          </div>
          <div class="row-actions">
            <button class="secondary viewBtn" data-id="${e.id}">View</button>
          </div>
          <div class="row-actions">
            <button class="downloadBtn" data-id="${e.id}">PDF</button>
          </div>
        </div>`;
    }).join('');

    document.querySelectorAll('.name, .viewBtn').forEach(el => {
      el.addEventListener('click', () => openModal(el.dataset.id));
    });
    document.querySelectorAll('.downloadBtn').forEach(el => {
      el.addEventListener('click', () => downloadSingle(el.dataset.id));
    });
    document.querySelectorAll('.rowCheck').forEach(el => {
      el.addEventListener('change', updateSelection);
    });
  }

  function updateSelection() {
    const checked = document.querySelectorAll('.rowCheck:checked');
    exportBtn.textContent = `Export Selected (${checked.length})`;
    exportBtn.disabled = checked.length === 0;
    selectAllEl.checked = checked.length === entries.length && entries.length > 0;
  }

  selectAllEl.addEventListener('change', function () {
    document.querySelectorAll('.rowCheck').forEach(cb => cb.checked = selectAllEl.checked);
    updateSelection();
  });

  document.getElementById('refreshBtn').addEventListener('click', loadEntries);

  exportBtn.addEventListener('click', function () {
    const ids = Array.from(document.querySelectorAll('.rowCheck:checked')).map(cb => cb.dataset.id);
    if (ids.length === 0) return;
    window.open(SCRIPT_URL + '?action=pdfbulk&ids=' + encodeURIComponent(ids.join(',')), '_blank');
  });

  function downloadSingle(id) {
    window.open(SCRIPT_URL + '?action=pdf&id=' + encodeURIComponent(id), '_blank');
  }

  // Modal
  const overlay = document.getElementById('modalOverlay');
  const modalBody = document.getElementById('modalBody');
  const modalDownloadBtn = document.getElementById('modalDownloadBtn');
  let currentId = null;

  function openModal(id) {
    const e = entries.find(x => x.id === id);
    if (!e) return;
    currentId = id;
    modalBody.innerHTML = `
      <div class="field"><b>First Name</b>${e.firstName || '—'}</div>
      <div class="field"><b>Middle Name</b>${e.middleName || '—'}</div>
      <div class="field"><b>Last Name</b>${e.lastName || '—'}</div>
      <div class="field"><b>Date of Birth</b>${e.dob || '—'}</div>
      <div class="field"><b>Address</b>${e.address || '—'}</div>
      <div class="field"><b>Place of Birth</b>${e.placeOfBirth || '—'}</div>
    `;
    overlay.classList.add('open');
  }

  document.getElementById('modalCloseBtn').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
  modalDownloadBtn.addEventListener('click', () => { if (currentId) downloadSingle(currentId); });

  loadEntries();
</script>
</body>
</html>
